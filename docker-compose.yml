version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sourceiq_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sourceiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sourceiq_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-sourceiq_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sourceiq} -d ${POSTGRES_DB:-sourceiq_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sourceiq_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sourceiq_backend
    env_file:
      - .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-sourceiq}:${POSTGRES_PASSWORD:-sourceiq_dev_pass}@postgres:5432/${POSTGRES_DB:-sourceiq_db}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sourceiq_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
